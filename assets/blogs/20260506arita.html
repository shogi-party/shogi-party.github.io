  vertical-align: middle;
}

.markdown-body ul:dir(rtl) .task-list-item-checkbox {
  margin: 0 -1.6em .25em .2em;
}

.markdown-body ol:dir(rtl) .task-list-item-checkbox {
  margin: 0 -1.6em .25em .2em;
}

.markdown-body .contains-task-list:hover .task-list-item-convert-container,
.markdown-body .contains-task-list:focus-within .task-list-item-convert-container {
  display: block;
  width: auto;
  height: 24px;
  overflow: visible;
  clip-path: none;
}

.markdown-body ::-webkit-calendar-picker-indicator {
  filter: invert(50%);
}

.markdown-body .markdown-alert {
  padding: var(--base-size-8) var(--base-size-16);
  margin-bottom: var(--base-size-16);
  color: inherit;
  border-left: .25em solid var(--borderColor-default);
}

.markdown-body .markdown-alert>:first-child {
  margin-top: 0;
}

.markdown-body .markdown-alert>:last-child {
  margin-bottom: 0;
}

.markdown-body .markdown-alert .markdown-alert-title {
  display: flex;
  font-weight: var(--base-text-weight-medium, 500);
  align-items: center;
  line-height: 1;
}

.markdown-body .markdown-alert.markdown-alert-note {
  border-left-color: var(--borderColor-accent-emphasis);
}

.markdown-body .markdown-alert.markdown-alert-note .markdown-alert-title {
  color: var(--fgColor-accent);
}

.markdown-body .markdown-alert.markdown-alert-important {
  border-left-color: var(--borderColor-done-emphasis);
}

.markdown-body .markdown-alert.markdown-alert-important .markdown-alert-title {
  color: var(--fgColor-done);
}

.markdown-body .markdown-alert.markdown-alert-warning {
  border-left-color: var(--borderColor-attention-emphasis);
}

.markdown-body .markdown-alert.markdown-alert-warning .markdown-alert-title {
  color: var(--fgColor-attention);
}

.markdown-body .markdown-alert.markdown-alert-tip {
  border-left-color: var(--borderColor-success-emphasis);
}

.markdown-body .markdown-alert.markdown-alert-tip .markdown-alert-title {
  color: var(--fgColor-success);
}

.markdown-body .markdown-alert.markdown-alert-caution {
  border-left-color: var(--borderColor-danger-emphasis);
}

.markdown-body .markdown-alert.markdown-alert-caution .markdown-alert-title {
  color: var(--fgColor-danger);
}

.markdown-body>*:first-child>.heading-element:first-child {
  margin-top: 0 !important;
}

.markdown-body .highlight pre:has(+.zeroclipboard-container) {
  min-height: 52px;
}

      <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }

    #save-filename {
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    /* ヘッダー (固定ナビゲーション) */
    #header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background-color: #333;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      z-index: 1000;
    }
    #app-title {
      font-weight: bold;
      font-size: 16px;
    }
    #button-group button {
      margin-left: 5px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      background-color: #555;
      color: #fff;
      border: 1px solid #777;
      border-radius: 3px;
    }
    #button-group button:hover {
      background-color: #777;
    }

    /* メインコンテンツエリア */
    #main-container {
      margin-top: 40px;
      height: calc(100vh - 40px);
      width: 100%;
    }

    /* 左右2分割レイアウト */
    .split-view {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .split-pane {
      width: 50%;
      height: 100%;
      overflow: auto;
    }
    textarea.editor {
      width: 100%;
      height: 100%;
      padding: 15px;
      border: none;
      border-right: 1px solid #ccc;
      resize: none;
      font-family: monospace;
      font-size: 14px;
      outline: none;
      background-color: #fdfdfd;
    }

    /* 閲覧モード用レイアウト */
    .view-mode-container {
      width: 100%;
      max-width: 980px;
      margin-left: auto;
      margin-right: auto;    
      padding: 0 20px;
      box-sizing: border-box;
    }

    /* --- 追加：カスタムモーダルダイアログのスタイル --- */
    .modal-overlay {
      display: none; /* 初期状態は非表示 */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fff;
      width: 300px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      font-family: sans-serif;
    }
    #save-modal .modal-content {
      width: 600px;
      max-width: 90vw; /* 画面幅が狭い場合に画面からはみ出さないようにする安全策 */
    }
    .modal-header {
      background-color: #eee;
      padding: 10px;
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid #ccc;
      font-size: 14px;
    }
    .modal-body {
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: #333;
    }
    .modal-footer {
      padding: 10px;
      text-align: center;
      border-top: 1px solid #eee;
    }
    .modal-footer button {
      padding: 5px 20px;
      cursor: pointer;
      background-color: #555;
      color: #fff;
      border: none;
      border-radius: 3px;
}

    /* 印刷時の設定 */
    @media print {
      #header {
        display: none !important;
      }
      #main-container {
        margin-top: 0 !important;
        height: auto !important;
        width: 100% !important;
      }
      html, body {
        height: auto !important;
        overflow: visible !important;
        background-color: #fff !important;
      }
      
      .view-mode-container {
        width: 980px !important;
        max-width: none !important;
        margin: 0 auto !important;
        padding: 0 !important;
      }

      .markdown-body {
        width: 100% !important;
        max-width: none !important; 
        padding: 0 !important;
        font-size: 16px !important;
      }

      .split-pane {
        overflow: visible !important;
      }
      @page {
        size: A4;
        margin: 20mm 15mm 20mm 20mm;
      }
    }
  </style>

      <script>
        let title = "第44回有田陶器市将棋大会　出場記";
        const readonly = true;
        let currentMode = "view";
        let markdownText = "## 有田陶器市将棋大会とは  \n佐賀県有田町では、特産品の有田焼の販売イベント、「有田陶器市」が開催されています。  \n毎年ゴールデンウィークに開催されており、多数の方が訪れています。  \n<br>\n「有田陶器市将棋大会」は、有田陶器市の開催期間に隣接する日程で開催されます。  \nこの大会は、地元佐賀県からだけでなく、長崎、熊本、福岡、大分、山口などからの参加者もいる有名な大会です。  \nプロ棋士による指導対局や、懸賞詰将棋など参加者を飽きさせない工夫がされています。  \n今年も、150名を超える方々が参加するにぎやかな大会となりました。  \n<br>\nこの大会は、実力に応じて3つのクラスに分かれています。  \nどのクラスに出場するか悩むのも大会の醍醐味の一つです。\n* **Ａ級（四段以上）**  40名弱  \n県大会や、全国大会佐賀県予選で上位入賞する実力者が揃っています。  \n* **Ｂ級（二～三段）**  約55名  \n上達著しい小中学生からベテランまで、様々な方が参加されています。\n* **Ｃ級（初段以下）**  約55名  \n最近将棋に興味を覚えた方や、大会参加経験が浅い方が参加されています。  \nたまに強い方もいます。  \n<br><br>\n\n## 有田陶器市将棋大会のようす\n写真をもとに、大会の雰囲気をお伝えしていきます。  \n<br>\n\n将棋大会会場、有田町生涯学習センター入口  \n今年も熱戦が期待されます。\n<div style=\"text-align: center;\">\n\n![IMG20260506091508.jpg](img_1785024052615)\n</div>\n\n<br><br>\nメイン会場、4階大ホールのようす  \n10時開始ですが、開始時間の30分前には多くの人が集まっていました。\n<div style=\"text-align: center;\">\n\n![IMG20260506093704.jpg](img_1785024371705)\n</div>\n<br><br>\nこの大会に参加すると、参加賞をもらうことができます。<br>\nいつもは湯呑などの陶器ですが、今年は昔の棋書も参加賞として用意されていました。<br>\n「いまだ投了せず」。今年の大会で、こうありたいものです。\n<div style=\"text-align: center;\">\n\n![IMG20260506092821.jpg](img_1785024812596)\n</div>\n\n<br><br>\n大会中の対局のようす<br>\n大会は、午前中に予選リーグ（4人）が行われ、上位2名が午後の本選トーナメントに出場できます。  \n<div style=\"text-align: center;\">\n\n![IMG20260506110405.jpg](img_1785025024176)\n</div>\n\n<br><br>\nこの大会には、参加賞だけでなく、昼食も用意されています。<br>\n大会運営の方々の配慮、御尽力には頭が下がります。\n<div style=\"text-align: center;\">\n\n![IMG20260506121801.jpg](img_1785025377842)\n</div>\n\n<br><br><br><br>\n午前中の予選を突破できなかった人は午後開催されるプロ棋士の指導対局を受けることができるので、予選の結果如何に関わらず昼食はおいしく食べることができます。  \n昼食をおいしく食べ、有田陶器市将棋大会、ゴールデンウィーク最終日を楽しく過ごすことができました。  \n<br>\n\n---\n大会の概要、結果は将棋夢未来に掲載されています。  \n* **第４４回有田陶器市将棋大会　概要**  \n<a href=\"https://yumemirai.hatenablog.com/entry/2026/03/16/230315\" target=\"_blank\" rel=\"noopener noreferrer\">https://yumemirai.hatenablog.com/entry/2026/03/16/230315</a>\n\n* **第４４回有田陶器市将棋大会　結果**  \n<a href=\"https://yumemirai.hatenablog.com/entry/2026/05/07/135119\" target=\"_blank\" rel=\"noopener noreferrer\">https://yumemirai.hatenablog.com/entry/2026/05/07/135119</a>\n\n\n\n";

        function renderMarkdown(md) {
      let parsed = typeof marked.parse === 'function' ? marked.parse(md) : md;
      Object.keys(imagesMap).forEach(key => {
        const regex = new RegExp(key, 'g');
        parsed = parsed.replace(regex, imagesMap[key]);
      });
      return parsed;
    }
        function updateDynamicCss(css) {
      document.getElementById("dynamic-css").innerHTML = css;
    }
        function editTitle() {
      const newTitle = prompt("新しいタイトルを入力してください:", title);
      if (newTitle !== null && newTitle.trim() !== "") {
        title = newTitle;
        document.getElementById("app-title").textContent = title;
        document.title = title;
      }
    }
        function showAbout() {
      document.getElementById("about-modal").style.display = "flex";
    }
        function closeAbout() {
      document.getElementById("about-modal").style.display = "none";
    }
        function setMode(mode) {
      if (readonly && mode !== "view") return;
      currentMode = mode;

      const container = document.getElementById("main-container");
      const btnMdEdit = document.getElementById("btn-md-edit");
      const btnTitleEdit = document.getElementById("btn-title-edit");
      const btnCssEdit = document.getElementById("btn-css-edit");
      const btnImgLoad = document.getElementById("btn-img-load");
      const btnView = document.getElementById("btn-view");
      const btnSave = document.getElementById("btn-save");
      const btnAbout = document.getElementById("btn-about");

      if (readonly) {
        btnMdEdit.style.display = "none";
        btnTitleEdit.style.display = "none";
        btnCssEdit.style.display = "none";
        btnImgLoad.style.display = "none";
        btnView.style.display = "none";
        btnSave.style.display = "none";
      } else {
        btnMdEdit.style.display = (mode === "css-edit" || mode === "view") ? "inline-block" : "none";
        btnTitleEdit.style.display = (mode === "md-edit") ? "inline-block" : "none";
        btnCssEdit.style.display = (mode === "md-edit") ? "inline-block" : "none";
        btnImgLoad.style.display = (mode === "md-edit") ? "inline-block" : "none";
        btnView.style.display    = (mode === "md-edit") ? "inline-block" : "none";
        btnSave.style.display    = (mode === "md-edit") ? "inline-block" : "none";
      }
      btnAbout.style.display   = "inline-block";

      container.innerHTML = "";

      if (mode === "view") {
        const viewWrapper = document.createElement("div");
        viewWrapper.className = "view-mode-container";
        const preview = document.createElement("div");
        preview.className = "markdown-body";
        preview.innerHTML = renderMarkdown(markdownText);
        viewWrapper.appendChild(preview);
        container.appendChild(viewWrapper);
      } 
      else if (mode === "md-edit") {
        const splitView = document.createElement("div");
        splitView.className = "split-view";

        const leftPane = document.createElement("div");
        leftPane.className = "split-pane";
        const editor = document.createElement("textarea");
        editor.className = "editor";
        editor.value = markdownText;
        editor.oninput = (e) => {
          markdownText = e.target.value;
          rightPane.querySelector(".markdown-body").innerHTML = renderMarkdown(markdownText);
        };
        leftPane.appendChild(editor);

        const rightPane = document.createElement("div");
        rightPane.className = "split-pane";
        const preview = document.createElement("div");
        preview.className = "markdown-body";
        preview.innerHTML = renderMarkdown(markdownText);
        rightPane.appendChild(preview);

        splitView.appendChild(leftPane);
        splitView.appendChild(rightPane);
        container.appendChild(splitView);
      } 
      else if (mode === "css-edit") {
        const splitView = document.createElement("div");
        splitView.className = "split-view";

        const leftPane = document.createElement("div");
        leftPane.className = "split-pane";
        const cssEditor = document.createElement("textarea");
        cssEditor.className = "editor";
        cssEditor.value = customCssText;
        cssEditor.oninput = (e) => {
          customCssText = e.target.value;
          updateDynamicCss(customCssText);
        };
        leftPane.appendChild(cssEditor);

        const rightPane = document.createElement("div");
        rightPane.className = "split-pane";
        const preview = document.createElement("div");
        preview.className = "markdown-body";
        preview.innerHTML = renderMarkdown(markdownText);
        rightPane.appendChild(preview);

        splitView.appendChild(leftPane);
        splitView.appendChild(rightPane);
        container.appendChild(splitView);
      }
    }
        function loadImage() {
      document.getElementById("image-input").click();
    }
        function handleImageSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result;
        const imageKey = `img_${Date.now()}`;
        imagesMap[imageKey] = base64Data;

        // エディタに記述を挿入 (![alt](imageKey))
        const imageMarkdown = `\n![${file.name}](${imageKey})\n`;
        const editor = document.querySelector("textarea.editor");
        if (editor) {
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          markdownText = markdownText.substring(0, start) + imageMarkdown + markdownText.substring(end);
          editor.value = markdownText;
          document.querySelectorAll(".markdown-body").forEach(el => {
            el.innerHTML = renderMarkdown(markdownText);
          });
        }
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }
        function saveDocument() {
      let fileName = "";

      try {
        const fullPath = window.location.href;
        const pathParts = fullPath.split('/');
        const lastPart = pathParts[pathParts.length - 1];

        if (lastPart) {
          fileName = decodeURIComponent(lastPart);
        }
      } catch (e) {
        console.error("ファイル名の取得に失敗しました", e);
      }

      const filenameInput = document.getElementById("save-filename");
      
      if (fileName && fileName !== "" && fileName !== window.location.pathname) {
        filenameInput.value = fileName;
      } else {
        try {
          const pName = decodeURIComponent(window.location.pathname.split('/').pop());
          filenameInput.value = (pName && pName !== "/") ? pName : "document.html";
        } catch(err) {
          filenameInput.value = "document.html";
        }
      }

      const hasImages = Object.keys(imagesMap).length > 0;
      if (hasImages) {
        const embed = confirm("画像をファイルに埋め込んで保存しますか？\n[OK]: 埋め込む (Base64)\n[キャンセル]: リンクのまま保存");
        window.pendingEmbedOption = embed;
      } else {
        window.pendingEmbedOption = false;
      }

      document.getElementById("save-modal").style.display = "flex";
    }
        function executeSave() {
      const fileName = document.getElementById("save-filename").value || "document.html";
      const isReadonly = document.getElementById("save-readonly").checked;
      const embedImages = window.pendingEmbedOption || false;

      // 保存用HTMLデータの生成（isReadonlyを引数に渡す）
      const htmlContent = generateSelfContainedHtml(embedImages, isReadonly);
      
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
      URL.revokeObjectURL(link.href);

      closeSaveModal();
    }
        function closeSaveModal() {
      document.getElementById("save-modal").style.display = "none";
    }
